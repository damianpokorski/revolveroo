name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # mise.toml is the single source of truth for the Bun version — read it here so this
      # workflow can't drift from it. package.json's packageManager field and the Dockerfile's
      # oven/bun pin can't read TOML directly, so those two stay manually pinned and are
      # cross-checked against mise.toml by the "Check version pins" step below instead.
      - name: Read tool versions from mise.toml
        id: mise
        run: echo "bun=$(scripts/mise-tool-version.sh bun)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.mise.outputs.bun }}

      - name: Check version pins
        run: bun run check-versions

      - name: Cache Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Self-hosted Nerd Font (binary release asset, not committed) — needed before both
      # `build` (bundles it into the static output) and the e2e step (dev server serves
      # it straight from apps/web/static/fonts/). Mirrors the Dockerfile's own ordering.
      - name: Fetch self-hosted Nerd Font
        run: bun run fonts:setup

      - name: Type-check
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      # Separate from `build` on purpose (docs scripts are named docs:* so `vp run -r build`
      # and the Dockerfile skip them). Catches broken frontmatter/links before the Pages deploy.
      - name: Build docs site
        run: bun run docs:build

      # --with-deps installs the Ubuntu system libraries Chromium needs. The repo's own
      # `test:e2e:install` script deliberately skips --with-deps (it also has to work in
      # sandboxes without passwordless sudo); GitHub-hosted runners have full sudo, and a
      # bare `playwright install` here would likely fail outright on a cold cache.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      # Not preinstalled on GitHub-hosted runners — needed for the e2e suite's
      # optional-proxy spec (apps/web/e2e/proxy.spec.ts), which spawns a real
      # `caddy` process, same as CONTRIBUTING.md asks local e2e contributors to have.
      - name: Install Caddy
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
          sudo apt-get update
          sudo apt-get install -y caddy

      # Runs against a disposable, self-seeding YAML data file — apps/web/playwright.config.ts's
      # webServer entry wipes any leftover file before listening, and the server itself
      # creates the default data file on boot, so no CI-specific setup is needed here.
      - name: E2E / browser tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Build Docker image
        run: docker build -t revolver:ci .

      - name: Docker smoke test
        run: |
          docker run -d --name revolver-ci -p 80:80 -v revolver-ci-data:/data revolver:ci

          ready=false
          for _ in $(seq 1 15); do
            if curl -sf http://localhost:80/api/health >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "::error::Container never became healthy"
            docker logs revolver-ci
            exit 1
          fi

          echo "Container is healthy"

      - name: Tear down smoke-test container
        if: always()
        run: |
          docker rm -f revolver-ci 2>/dev/null || true
          docker volume rm revolver-ci-data 2>/dev/null || true
