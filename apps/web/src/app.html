<!doctype html>
<html lang="en">
  <head>
    <script>
      (() => {
        try {
          const t = localStorage.getItem("revolver-theme");
          if (t) document.documentElement.dataset.theme = t;
        } catch (_e) {}
      })();
    </script>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#CBA6F7" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1E1E2E" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
