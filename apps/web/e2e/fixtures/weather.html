<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Weather</title>
    <style>
      :root {
        --bg: #2b1e1a;
        --panel: #3a2a24;
        --raised: #4f382f;
        --rule: #5a4038;
        --text: #f5e3d8;
        --text-muted: #d8b9a8;
        --text-dim: #a4847a;
        --accent: #f5a97f;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fff3e9;
          --panel: #ffffff;
          --raised: #ffe4cc;
          --rule: #ffd4ad;
          --text: #5c3a24;
          --text-muted: #8a6248;
          --text-dim: #b08868;
          --accent: #e07a3f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        padding: 2.5rem;
      }
      header {
        margin-bottom: 2rem;
      }
      header h1 {
        margin: 0 0 0.3rem;
        font-size: 1.5rem;
        font-weight: 600;
      }
      header p {
        margin: 0;
        color: var(--text-muted);
      }
      .now {
        display: flex;
        align-items: baseline;
        gap: 1.25rem;
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 12px;
        padding: 1.75rem 2rem;
        margin-bottom: 1.5rem;
      }
      .now .temp {
        font-size: 4rem;
        font-weight: 700;
        line-height: 1;
      }
      .now .desc {
        color: var(--text-muted);
        font-size: 1.1rem;
      }
      .forecast {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 1rem;
      }
      .day {
        background: var(--raised);
        border-radius: 10px;
        padding: 1rem 0.75rem;
        text-align: center;
      }
      .day .name {
        color: var(--text-muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .day .icon {
        font-size: 1.75rem;
        margin: 0.5rem 0;
      }
      .day .range {
        font-size: 0.9rem;
        color: var(--accent);
        font-weight: 600;
      }
      @media (max-width: 600px) {
        body {
          padding: 1.25rem;
        }
        .now {
          flex-direction: column;
          gap: 0.4rem;
          padding: 1.25rem 1.5rem;
        }
        .now .temp {
          font-size: 2.75rem;
        }
        .forecast {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 data-testid="fixture-marker">🌤️ Weather Station</h1>
      <p>Outside · updated just now</p>
    </header>

    <div class="now">
      <span class="temp">9°</span>
      <span class="desc">Partly cloudy, light breeze</span>
    </div>

    <div class="forecast">
      <div class="day">
        <div class="name">Wed</div>
        <div class="icon">⛅</div>
        <div class="range">9° / 4°</div>
      </div>
      <div class="day">
        <div class="name">Thu</div>
        <div class="icon">🌧️</div>
        <div class="range">7° / 3°</div>
      </div>
      <div class="day">
        <div class="name">Fri</div>
        <div class="icon">☀️</div>
        <div class="range">11° / 5°</div>
      </div>
      <div class="day">
        <div class="name">Sat</div>
        <div class="icon">☀️</div>
        <div class="range">12° / 6°</div>
      </div>
      <div class="day">
        <div class="name">Sun</div>
        <div class="icon">⛅</div>
        <div class="range">10° / 5°</div>
      </div>
    </div>
  </body>
</html>
